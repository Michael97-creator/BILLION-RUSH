<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billion Rush — Multiplayer</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div><span class="brand">BILLION RUSH</span><h1>Multiplayer Rush</h1></div><div id="connection" class="pill online">● CONNECTED</div></header><section id="waiting" class="panel"><p class="eyebrow">MATCH ROOM</p><h2>Waiting for opponent</h2><div class="players"><div class="player-card"><b>You</b><span id="youName">Player</span><small>Ready</small></div><div class="vs">VS</div><div class="player-card"><b>Opponent</b><span id="opponentName">Searching…</span><small id="opponentStatus">Waiting</small></div></div></section><section id="game" class="hidden"><div class="topbar"><div>Question <strong id="round">1</strong>/20</div><div class="timer" id="timer">30</div><div>₦<strong id="score">0</strong></div></div><div class="question panel"><p id="questionText">Question will appear here.</p><div id="options" class="options"></div><div id="reveal" class="reveal hidden"></div></div></section><section id="result" class="panel hidden"><p class="eyebrow">MATCH COMPLETE</p><h2 id="resultTitle">Results</h2><div class="result-grid"><div><small>Your score</small><strong id="finalScore">₦0</strong></div><div><small>Questions survived</small><strong id="survived">0/20</strong></div></div><button id="rematch">REMATCH</button></section><div id="notice" class="notice hidden"></div></main><script src="app.js"></script></body></html>
