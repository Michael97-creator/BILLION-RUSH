<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billion Rush</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"></head><body><main class="shell"><header><div class="brand">BILLION <span>RUSH</span></div><p>20 Questions. ₦1 Billion. How Far Will You Go?</p></header><section id="auth" class="card"><h2>Player Account</h2><input id="sburl" placeholder="Supabase URL"><input id="sbkey" placeholder="Supabase anon key"><input id="email" placeholder="Email" type="email"><input id="password" placeholder="Password" type="password"><button id="login">Sign In</button><button id="signup">Create Account</button><p id="authmsg"></p></section><section id="home" class="card"><button id="start">Start Rush</button><button id="multiplayer">Multiplayer</button><div class="note">Every question has 30 seconds. The server controls the game.</div></section><section id="game" class="card hidden"><div class="top"><strong id="money">₦0</strong><strong id="timer">30</strong></div><div class="ladder" id="ladder"></div><h2 id="question">Loading…</h2><div class="options" id="options"></div><div class="lifelines"><button data-life="fifty_fifty">50/50</button><button data-life="audience">Audience AI</button><button data-life="friend">Call Friend</button><button id="walk">Walk Away</button></div><p id="feedback"></p></section><section id="result" class="card hidden"><h2>Run Complete</h2><p id="summary"></p><button id="share">Share Result</button><button id="again">Play Again</button></section></main><script type="module" src="auth.js"></script><script src="app.js"></script></body></html>
